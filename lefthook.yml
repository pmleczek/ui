commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-commit:
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,jsx,mjs,json,jsonc,css,md,yml,yaml}'
      run: pnpm exec oxfmt --config oxfmt.config.ts {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,js,jsx,mjs}'
      run: pnpm exec oxlint --config oxlint.config.ts {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: branch-name
      run: bash scripts/branch-name.sh
    - name: typecheck
      run: pnpm typecheck
